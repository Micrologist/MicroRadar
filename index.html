<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MicroRadar</title>

  <!-- CesiumJS, pinned. CESIUM_BASE_URL must be the folder holding Cesium.js,
       Widgets/, Workers/ and Assets/ side by side; Cesium loads its workers and
       assets relative to it. Verified 2026-09-22: cdnjs carries all of them at
       this version, with Access-Control-Allow-Origin: * (which Cesium needs,
       because it fetches those assets cross-origin). -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.145.0/Widgets/widgets.css">
  <script>window.CESIUM_BASE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/cesium/1.145.0/';</script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --fg: #e6e8f0;
      --dim: #8b93ad;
      --line: #1e2743;
      --accent: #6ea8ff;
      --error: #ff8080;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      background: var(--bg);
      color: var(--fg);
      padding:
        env(safe-area-inset-top) env(safe-area-inset-right)
        env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow-x: hidden;
    }
    .wrap { padding: 12px; max-width: 46rem; margin: 0 auto; }
    header { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
    #status { margin-top: 4px; font-size: 16px; color: var(--dim); }
    #status.error { color: var(--error); }

    /* Not 100vh: iOS Safari's toolbars make that taller than the visible area. */
    #scene {
      height: 60vh;
      min-height: 300px;
      margin-top: 12px;
      border-radius: 10px;
      overflow: hidden;
      background: #1b2a1e;
    }
    #scene.hidden { display: none; }

    #controls { display: flex; gap: 8px; margin: 12px 0; }
    button {
      flex: 1 1 auto;
      min-height: 44px;
      padding: 10px 12px;
      font: inherit;
      font-size: 16px;
      color: var(--fg);
      background: #16203c;
      border: 1px solid var(--line);
      border-radius: 10px;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: #223055; }

    #me, #meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      color: var(--dim);
    }
    #meta { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line); }

    /* Cesium injects .cesium-credit-* markup in here: OSM's attribution, which
       their tile policy requires, plus Cesium's own logo. */
    #credits {
      margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--dim);
    }
    /* Outside a .cesium-viewer, widgets.css positions this absolutely at the
       bottom left of the page, where it lands on top of the map and the list.
       Put it back in the flow so it sits in the footer, as it should. */
    #credits .cesium-widget-credits {
      position: static;
      font-size: 12px;
      color: inherit;
      text-shadow: none;
    }
    #credits a { color: var(--dim); }
    #credits img { height: 14px; vertical-align: middle; }

    #aircraft { list-style: none; margin: 12px 0 0; padding: 0; }
    #aircraft li {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 15px;
      overflow-wrap: anywhere;
    }
    .row1 { display: flex; flex-wrap: wrap; gap: 4px 10px; }
    .call { font-weight: 600; color: var(--fg); }
    .type { color: var(--dim); }
    .row2 { margin-top: 2px; font-size: 13px; color: var(--dim); }
    .empty { color: var(--dim); font-size: 15px; padding: 8px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>MicroRadar</h1>
      <div id="status">Loading 3D library…</div>
    </header>

    <div id="scene"></div>

    <div id="controls">
      <button id="btn-locate" type="button">Find me</button>
      <button id="btn-recentre" type="button">Recentre</button>
    </div>

    <div id="me">No position yet.</div>

    <ol id="aircraft"></ol>

    <footer id="meta">No data yet.</footer>

    <div id="credits"></div>
  </div>

  <!-- After the markup above, so the header and list paint before this 1.75 MB
       (gzipped) download. No defer, no modules: the global Cesium is the API. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.145.0/Cesium.js"></script>

  <script>
    'use strict';

    // ---- constants (docs/plan-m1.md) ------------------------------------

    const POLL_MS = 8000;        // never below 5000; the aggregators allow 1 req/s
    const RADIUS_NM = 40;        // CLAUDE.md says 30-60 nm
    const FT_TO_M = 0.3048;
    const KT_TO_MPS = 0.514444;
    const STALE_S = 60;          // drop aircraft whose position is older than this
    const MAX_BACKOFF_MS = 60000;  // ceiling when a source keeps failing
    const TICK_MS = 500;         // re-render interval for extrapolation
    const EARTH_R = 6371000;     // metres

    // ---- constants (docs/plan-m2.md, the 3D scene) -----------------------

    const IMAGERY_URL = 'https://tile.openstreetmap.org/';  // no key; '' for a plain globe
    const TARGET_FPS = 30;       // smooth enough, half the battery of 60
    const CAMERA_RANGE_M = 60000;   // how far the camera sits from the user
    const CAMERA_PITCH_DEG = -45;   // looking down at 45°
    const MIN_ZOOM_M = 300;
    const MAX_ZOOM_M = 400000;
    const RING_KM = [10, 25, 50];   // range rings on the ground
    const RING_HEIGHT_M = 5;     // just above the ellipsoid, so chords never dip below it
    const RING_HEIGHT_FT = RING_HEIGHT_M / FT_TO_M;  // cartesianOf() works in feet
    const RING_SEGMENTS = 72;
    const NOSE_S = 30;           // heading line = where it will be in this many seconds
    const AC_COLOR = '#ffa500';      // airborne
    const GROUND_COLOR = '#8b93ad';  // on the ground, or altitude unknown
    const ME_COLOR = '#6ea8ff';      // the user; same as the CSS accent

    // The aggregators send no Access-Control-Allow-Origin header on their /v2/*
    // routes, so a browser is never allowed to read the response even though the
    // JSON itself is fine (see docs/plan-m1.md, "API verification"). Requests go
    // through a small proxy (Cloudflare Worker or Val Town val — same code) that
    // adds the header. Deploy one and put its URL here, with no trailing slash —
    // see proxy/README.md.
    const PROXY_BASE = 'https://micrologist--25362770b69011f19e211607ee4eb77e.web.val.run';   // Val Town; Worker: https://microradar-proxy.throbbing-mountain-edd5.workers.dev

    // airplanes.live was the fallback until 2026-09-22. It gates API access behind
    // an email to contact@airplanes.live and answered 403 throughout, and a dead
    // fallback cost three polls per adsb.lol 429, so it was removed rather than
    // left in. See CLAUDE.md "Data source" to bring it back.
    const SOURCE = { name: 'adsb.lol', path: (lat, lon, r) => `/adsb.lol/v2/point/${lat}/${lon}/${r}` };

    // ---- state ----------------------------------------------------------

    const state = {
      me: null,          // { lat, lon, accuracy, at }
      aircraft: [],      // normalised aircraft from the last successful poll
      lastPollAt: 0,
      lastError: null,
      pollTimer: null,
      failures: 0,       // consecutive failed polls, drives the backoff
    };

    // Everything Cesium-side lives here, so the data in `state` never mixes with
    // the rendering. Empty and inert until initScene() succeeds.
    const view3d = {
      ready: false,
      error: null,        // why there is no 3D, for the status line
      viewer: null,
      points: null,       // PointPrimitiveCollection — aircraft dots and the user
      labels: null,       // LabelCollection — callsigns
      lines: null,        // PolylineCollection — stalks and heading lines
      ground: null,       // PolylineCollection — range rings
      groundLabels: null, // LabelCollection — N/E/S/W and ring distances
      mePoint: null,
      marks: new Map(),   // hex -> { point, label, stalk, nose }
      stalkMaterial: null,
      noseMaterial: null,
      airColor: null,     // AC_COLOR and GROUND_COLOR as Cesium colours,
      groundColor: null,  // parsed once instead of per aircraft per poll
      warned: new Set(),  // hexes already complained about, so a bad one warns once
    };

    const $ = (id) => document.getElementById(id);

    // ---- status ---------------------------------------------------------

    function setStatus(text, isError = false) {
      const el = $('status');
      el.textContent = text;
      el.classList.toggle('error', !!isError);
    }

    // ---- geolocation ----------------------------------------------------

    function locate() {
      if (!navigator.geolocation) {
        setStatus('Geolocation not available', true);
        return;
      }
      setStatus('Finding you…');
      navigator.geolocation.getCurrentPosition(onFix, onGeoError, {
        enableHighAccuracy: false,
        timeout: 15000,
        maximumAge: 60000,
      });
    }

    function onFix(pos) {
      state.me = {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        at: Date.now(),
      };
      $('btn-locate').textContent = 'Refresh position';
      setStatus('Got a fix');
      renderMe();
      if (view3d.ready) {
        buildGround(state.me);
        resetCamera();
      }
      startPolling();
    }

    function onGeoError(err) {
      const msgs = {
        1: 'Location permission denied',
        2: 'Position unavailable',
        3: 'Location timed out',
      };
      setStatus(msgs[err.code] || ('Location error: ' + err.message), true);
    }

    function renderMe() {
      if (!state.me) {
        $('me').textContent = 'No position yet.';
        return;
      }
      const { lat, lon, accuracy, at } = state.me;
      const ageS = Math.round((Date.now() - at) / 1000);
      $('me').textContent =
        `${lat.toFixed(4)}, ${lon.toFixed(4)} · ±${Math.round(accuracy)} m · fix ${ageS}s ago`;
    }

    // ---- polling --------------------------------------------------------

    let loggedSample = false;

    // Every call to startPolling() begins a new generation. An older poll that is
    // still awaiting its fetch will find gen !== pollGen when it finishes and will
    // not schedule anything, so taps and visibilitychange can't leave extra poll
    // chains running in parallel — which quietly multiplied the request rate.
    let pollGen = 0;

    function startPolling() {
      clearTimeout(state.pollTimer);
      state.pollTimer = null;
      poll(++pollGen);
    }

    async function poll(gen) {
      if (!state.me) return;
      if (!PROXY_BASE) {
        setStatus('No proxy configured — set PROXY_BASE in index.html (see proxy/README.md)', true);
        return;
      }
      const src = SOURCE;
      const url = PROXY_BASE + src.path(state.me.lat.toFixed(4), state.me.lon.toFixed(4), RADIUS_NM);
      const ctl = new AbortController();
      const abortTimer = setTimeout(() => ctl.abort(), 10000);

      try {
        const res = await fetch(url, { cache: 'no-store', signal: ctl.signal });
        if (!res.ok) {
          // The proxy passes the aggregator's body through. JSON errors say
          // something useful ({"detail":"..."}); nginx sends an HTML page whose
          // <title> is the useful part ("429 Too Many Requests"), and the status
          // line already shows the code, so drop it from the front.
          let detail = '';
          try {
            const body = (await res.text()).trim();
            const title = body.match(/<title>([^<]*)<\/title>/i);
            detail = (title ? title[1] : body.replace(/<[^>]*>/g, ' '))
              .replace(/\s+/g, ' ').trim().replace(/^\d{3}\s+/, '').slice(0, 120);
          } catch (e) { /* no body */ }
          throw new Error('HTTP ' + res.status + (detail ? ' — ' + detail : ''));
        }
        const json = await res.json();
        if (!Array.isArray(json.ac)) throw new Error('no aircraft array in response');

        if (!loggedSample && json.ac.length) {
          loggedSample = true;
          console.log('raw aircraft sample from ' + src.name + ':', json.ac[0]);
        }

        const now = Date.now();
        state.aircraft = json.ac.map((raw) => normalise(raw, now)).filter(Boolean);
        state.lastPollAt = now;
        state.lastError = null;
        state.failures = 0;
        setStatus('OK · ' + src.name);
        syncMarks();
        render();
      } catch (err) {
        const why = err.name === 'AbortError' ? 'timed out' : err.message;
        state.failures++;
        state.lastError = src.name + ': ' + why;
        setStatus(state.lastError + ' · retrying in ' + Math.round(nextDelayMs() / 1000) + 's', true);
      } finally {
        clearTimeout(abortTimer);
        if (gen === pollGen) state.pollTimer = setTimeout(startPolling, nextDelayMs());
      }
    }

    // Normal cadence while healthy; back off when the source keeps refusing, so a
    // rate limit is not answered by hammering it every 8 seconds.
    function nextDelayMs() {
      if (!state.failures) return POLL_MS;
      return Math.min(POLL_MS * Math.pow(2, state.failures), MAX_BACKOFF_MS);
    }

    // ---- normalising ----------------------------------------------------

    function normalise(raw, now) {
      if (typeof raw.lat !== 'number' || typeof raw.lon !== 'number') return null;
      const seenPos = typeof raw.seen_pos === 'number' ? raw.seen_pos : 0;
      if (seenPos > STALE_S) return null;

      // Prefer geometric altitude; alt_baro may be a number or the string "ground".
      let altFt = null;
      if (typeof raw.alt_geom === 'number') altFt = raw.alt_geom;
      else if (raw.alt_baro === 'ground') altFt = 0;
      else if (typeof raw.alt_baro === 'number') altFt = raw.alt_baro;

      return {
        hex: raw.hex,
        callsign: (raw.flight || '').trim() || raw.r || raw.hex,
        type: raw.t || '',
        reg: raw.r || '',
        lat: raw.lat,
        lon: raw.lon,
        altFt: altFt,
        onGround: raw.alt_baro === 'ground',
        gsKt: typeof raw.gs === 'number' ? raw.gs : null,
        // track is missing on about a third of aircraft; some of those carry the
        // aggregator's derived calc_track instead (see docs/plan-m1.md results).
        track: typeof raw.track === 'number' ? raw.track
             : typeof raw.calc_track === 'number' ? raw.calc_track : null,
        vsFpm: typeof raw.baro_rate === 'number' ? raw.baro_rate : 0,
        fixedAt: now - seenPos * 1000,
      };
    }

    // ---- geometry -------------------------------------------------------

    // Equirectangular local tangent plane, metres east / north / up.
    // Milestone 2 feeds this straight into three.js, so keep it pure.
    function toENU(lat, lon, altFt, me) {
      const dLat = (lat - me.lat) * Math.PI / 180;
      const dLon = (lon - me.lon) * Math.PI / 180;
      const cosLat = Math.cos(me.lat * Math.PI / 180);
      return {
        e: EARTH_R * dLon * cosLat,
        n: EARTH_R * dLat,
        u: (altFt ?? 0) * FT_TO_M,
      };
    }

    // The inverse of toENU: move a point eM metres east and nM metres north on
    // the same equirectangular approximation.
    function offsetLatLon(lat, lon, eM, nM) {
      const cosLat = Math.cos(lat * Math.PI / 180);
      return {
        lat: lat + (nM / EARTH_R) * 180 / Math.PI,
        lon: lon + (eM / (EARTH_R * cosLat)) * 180 / Math.PI,
      };
    }

    const COMPASS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE',
                     'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];

    function compassPoint(bearing) {
      return COMPASS[Math.round(bearing / 22.5) % 16];
    }

    // Move a fix dtS seconds along its track. Returns a copy; the input is never
    // touched. The 3D heading line is the same maths with a fixed dt.
    function advance(ac, dtS) {
      if (ac.gsKt === null || ac.track === null || ac.onGround) return ac;

      const dist = ac.gsKt * KT_TO_MPS * dtS;
      const trackRad = ac.track * Math.PI / 180;
      const { lat, lon } = offsetLatLon(ac.lat, ac.lon,
                                        dist * Math.sin(trackRad), dist * Math.cos(trackRad));
      const altFt = typeof ac.altFt === 'number' ? ac.altFt + ac.vsFpm * dtS / 60 : ac.altFt;

      return { ...ac, lat, lon, altFt };
    }

    // Advance a fix to now so the numbers move between polls. state.aircraft always
    // holds the last real fix and is replaced wholesale on every poll, which is the
    // "reset on each new fix" from CLAUDE.md. Clamped at STALE_S, so an aircraft
    // that stops reporting freezes instead of flying off.
    function extrapolate(ac, now) {
      return advance(ac, Math.min(Math.max((now - ac.fixedAt) / 1000, 0), STALE_S));
    }

    // ---- display --------------------------------------------------------

    function describe(ac, me, now) {
      const p = extrapolate(ac, now);
      const enu = toENU(p.lat, p.lon, p.altFt, me);
      const distKm = Math.hypot(enu.e, enu.n) / 1000;
      const bearing = (Math.atan2(enu.e, enu.n) * 180 / Math.PI + 360) % 360;
      const ageS = Math.round((now - ac.fixedAt) / 1000);

      let vsLabel = 'level';
      if (ac.vsFpm > 200) vsLabel = 'climbing';
      else if (ac.vsFpm < -200) vsLabel = 'descending';

      let altText;
      if (p.onGround) altText = 'on ground';
      else if (typeof p.altFt === 'number') altText = Math.round(p.altFt).toLocaleString('en-GB') + ' ft';
      else altText = 'alt ?';

      let vsText = vsLabel;
      if (vsLabel !== 'level') {
        vsText = (ac.vsFpm > 0 ? '↑ ' : '↓ ') + vsLabel + ' ' +
                 Math.abs(Math.round(ac.vsFpm)).toLocaleString('en-GB') + ' ft/min';
      }

      return {
        distKm,
        callsign: p.callsign,
        type: p.type || '—',
        altText,
        distText: distKm.toFixed(1) + ' km',
        bearingText: compassPoint(bearing) + ' (' + String(Math.round(bearing) % 360).padStart(3, '0') + '°)',
        vsText,
        gsText: typeof p.gsKt === 'number' ? Math.round(p.gsKt) + ' kt' : 'speed ?',
        ageText: 'seen ' + ageS + 's ago',
      };
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function render() {
      renderMe();
      const list = $('aircraft');

      if (!state.me) {
        list.innerHTML = '';
        return;
      }

      const now = Date.now();
      const rows = state.aircraft
        .map((ac) => describe(ac, state.me, now))
        .sort((a, b) => a.distKm - b.distKm);

      if (!rows.length) {
        list.innerHTML = '<li class="empty">No aircraft in range.</li>';
      } else {
        // Dumb on purpose: rebuild the whole list every tick.
        list.innerHTML = rows.map((r) => (
          '<li><div class="row1">' +
            '<span class="call">' + esc(r.callsign) + '</span>' +
            '<span class="type">' + esc(r.type) + '</span>' +
            '<span>' + esc(r.altText) + '</span>' +
            '<span>' + esc(r.distText) + '</span>' +
            '<span>' + esc(r.bearingText) + '</span>' +
          '</div><div class="row2">' +
            esc(r.vsText) + ' · ' + esc(r.gsText) + ' · ' + esc(r.ageText) +
          '</div></li>'
        )).join('');
      }

      const src = SOURCE.name;
      $('meta').textContent = state.lastPollAt
        ? `${rows.length} aircraft · updated ${Math.round((now - state.lastPollAt) / 1000)}s ago · source ${src}`
        : `No data yet · source ${src}`;
    }

    // ---- 3D scene (docs/plan-m2.md) --------------------------------------

    // Creates the Cesium viewer. Never throws: on any failure it hides the scene,
    // records why in view3d.error and returns false, so the milestone 1 list keeps
    // working on a device with no WebGL or behind a content blocker.
    function initScene() {
      if (typeof Cesium === 'undefined') {
        return failScene('3D library failed to load — list only');
      }

      try {
        // No ion account, by CLAUDE.md: blank the built-in demo token first, so
        // nothing can quietly fall back to it. Must happen before any Cesium
        // object exists.
        Cesium.Ion.defaultAccessToken = '';

        const viewer = new Cesium.Viewer('scene', {
          baseLayer: IMAGERY_URL
            ? new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({
                url: IMAGERY_URL,
                // showOnScreen, so the attribution OSM's tile policy asks for is
                // on the page rather than behind Cesium's "Data attribution" link.
                credit: new Cesium.Credit(
                  '© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
                  true),
              }))
            : false,
          terrain: undefined,   // plain ellipsoid; Cesium World Terrain needs ion
          animation: false, timeline: false, geocoder: false, homeButton: false,
          sceneModePicker: false, baseLayerPicker: false, navigationHelpButton: false,
          fullscreenButton: false, infoBox: false, selectionIndicator: false,
          skyBox: false, skyAtmosphere: false,
          creditContainer: 'credits',
          targetFrameRate: TARGET_FPS,
        });

        const scene = viewer.scene;
        scene.globe.baseColor = Cesium.Color.fromCssColorString('#1b2a1e');
        scene.globe.showGroundAtmosphere = false;
        scene.fog.enabled = false;
        scene.backgroundColor = Cesium.Color.fromCssColorString('#0b1020');
        scene.screenSpaceCameraController.minimumZoomDistance = MIN_ZOOM_M;
        scene.screenSpaceCameraController.maximumZoomDistance = MAX_ZOOM_M;
        scene.preUpdate.addEventListener(updateScene);

        // Order matters only for what draws over what: rings first, then the
        // lines, then the dots and their labels.
        view3d.ground = scene.primitives.add(new Cesium.PolylineCollection());
        view3d.groundLabels = scene.primitives.add(new Cesium.LabelCollection());
        view3d.lines = scene.primitives.add(new Cesium.PolylineCollection());
        view3d.points = scene.primitives.add(new Cesium.PointPrimitiveCollection());
        view3d.labels = scene.primitives.add(new Cesium.LabelCollection());

        // One material instance per kind of line: that is what lets the
        // collection batch them into a single draw.
        view3d.stalkMaterial = Cesium.Material.fromType('Color', {
          color: Cesium.Color.fromCssColorString(AC_COLOR).withAlpha(0.4),
        });
        view3d.noseMaterial = Cesium.Material.fromType('Color', {
          color: Cesium.Color.fromCssColorString(AC_COLOR),
        });
        view3d.airColor = Cesium.Color.fromCssColorString(AC_COLOR);
        view3d.groundColor = Cesium.Color.fromCssColorString(GROUND_COLOR);

        view3d.viewer = viewer;
        view3d.ready = true;
        return true;
      } catch (err) {
        return failScene('3D unavailable (' + err.message + ') — list only');
      }
    }

    // The single place a position is handed to Cesium, so the argument order
    // (longitude first) can only be wrong in one place. There is no terrain, so
    // height 0 is the WGS84 ellipsoid, which is what alt_geom is measured from.
    function cartesianOf(lat, lon, altFt) {
      return Cesium.Cartesian3.fromDegrees(lon, lat, (altFt ?? 0) * FT_TO_M);
    }

    // Rebuilt on every fix: the user's dot, the range rings and the compass
    // letters. Everything here is static until the user moves.
    function buildGround(me) {
      if (!view3d.ready) return;

      view3d.ground.removeAll();
      view3d.groundLabels.removeAll();
      if (view3d.mePoint) view3d.points.remove(view3d.mePoint);

      view3d.mePoint = view3d.points.add({
        position: cartesianOf(me.lat, me.lon, 0),
        pixelSize: 10,
        color: Cesium.Color.fromCssColorString(ME_COLOR),
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 1,
      });

      // Dark, not white: over pale OpenStreetMap tiles a thin white line at low
      // alpha is invisible (the plan's 1 px white at 0.35 could not be seen at
      // all). Black at 0.5 reads over map and sea alike.
      const ringMaterial = Cesium.Material.fromType('Color', {
        color: Cesium.Color.BLACK.withAlpha(0.5),
      });
      for (const km of RING_KM) {
        const r = km * 1000;
        const positions = [];
        for (let i = 0; i <= RING_SEGMENTS; i++) {
          const th = (i / RING_SEGMENTS) * 2 * Math.PI;
          const p = offsetLatLon(me.lat, me.lon, r * Math.sin(th), r * Math.cos(th));
          positions.push(cartesianOf(p.lat, p.lon, RING_HEIGHT_FT));
        }
        view3d.ground.add({
          positions,
          width: 2,
          material: ringMaterial,
        });
        addGroundLabel(km + ' km', offsetLatLon(me.lat, me.lon, 0, r), '12px ui-monospace, monospace',
                       Cesium.Color.WHITE.withAlpha(0.6));
      }

      const far = RING_KM[RING_KM.length - 1] * 1000 * 1.1;
      ['N', 'E', 'S', 'W'].forEach((letter, i) => {
        const th = i * Math.PI / 2;
        addGroundLabel(letter, offsetLatLon(me.lat, me.lon, far * Math.sin(th), far * Math.cos(th)),
                       'bold 16px -apple-system, system-ui, sans-serif', Cesium.Color.WHITE);
      });
    }

    function addGroundLabel(text, pos, font, fillColor) {
      view3d.groundLabels.add({
        text,
        position: cartesianOf(pos.lat, pos.lon, RING_HEIGHT_FT),
        font,
        fillColor,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
        // Otherwise the curve of the globe swallows them at a low tilt.
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      });
    }

    // lookAt also installs a transform centred on the user, so the default
    // controller orbits around them. Heading 0 puts the camera south of the user
    // looking north, i.e. north up on the first view.
    function resetCamera() {
      if (!view3d.ready || !state.me) return;
      view3d.viewer.camera.lookAt(
        cartesianOf(state.me.lat, state.me.lon, 0),
        new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(CAMERA_PITCH_DEG), CAMERA_RANGE_M)
      );
    }

    // Once per poll: add a mark for every new aircraft, refresh the label and
    // colour of the ones we already have, and drop the ones that have gone.
    // Positions are left to updateScene() on the next frame.
    function syncMarks() {
      if (!view3d.ready) return;

      const live = new Set();
      for (const ac of state.aircraft) {
        live.add(ac.hex);
        let m = view3d.marks.get(ac.hex);
        if (!m) {
          m = {
            point: view3d.points.add({ pixelSize: 8, color: Cesium.Color.WHITE }),
            label: view3d.labels.add({
              text: ac.callsign,
              font: '13px -apple-system, system-ui, sans-serif',
              fillColor: Cesium.Color.WHITE,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 2,
              pixelOffset: new Cesium.Cartesian2(0, -12),
              verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
              disableDepthTestDistance: Number.POSITIVE_INFINITY,
            }),
            stalk: view3d.lines.add({ positions: [Cesium.Cartesian3.ZERO, Cesium.Cartesian3.ZERO],
                                      width: 1, material: view3d.stalkMaterial, show: false }),
            nose: view3d.lines.add({ positions: [Cesium.Cartesian3.ZERO, Cesium.Cartesian3.ZERO],
                                     width: 2, material: view3d.noseMaterial, show: false }),
          };
          view3d.marks.set(ac.hex, m);
        }
        // A callsign can turn up after the first sighting.
        m.label.text = ac.callsign;
        const airborne = !ac.onGround && typeof ac.altFt === 'number';
        m.point.color = airborne ? view3d.airColor : view3d.groundColor;
      }

      for (const [hex, m] of view3d.marks) {
        if (live.has(hex)) continue;
        view3d.points.remove(m.point);
        view3d.labels.remove(m.label);
        view3d.lines.remove(m.stalk);
        view3d.lines.remove(m.nose);
        view3d.marks.delete(hex);
      }
    }

    // Every frame: put each mark where its aircraft is now. The frame after a poll
    // snaps every mark to the new fix, which is the reset CLAUDE.md asks for.
    function updateScene() {
      if (!state.me) return;
      const now = Date.now();

      for (const ac of state.aircraft) {
        const m = view3d.marks.get(ac.hex);
        if (!m) continue;
        try {
          const p = extrapolate(ac, now);
          const pos = cartesianOf(p.lat, p.lon, p.altFt);
          m.point.position = pos;
          m.label.position = pos;

          const airborne = !p.onGround && typeof p.altFt === 'number';
          m.stalk.show = airborne;
          if (airborne) m.stalk.positions = [pos, cartesianOf(p.lat, p.lon, 0)];

          const hasTrack = p.gsKt !== null && p.track !== null && !p.onGround;
          m.nose.show = hasTrack;
          if (hasTrack) {
            const q = advance(p, NOSE_S);
            // Level on purpose: the line reads as a direction, not a climb.
            m.nose.positions = [pos, cartesianOf(q.lat, q.lon, p.altFt)];
          }
        } catch (err) {
          // This runs every frame; one bad aircraft must not stop the scene.
          if (!view3d.warned.has(ac.hex)) {
            view3d.warned.add(ac.hex);
            console.warn('skipping ' + ac.hex + ' in the 3D scene:', err);
          }
        }
      }
    }

    function failScene(text) {
      view3d.ready = false;
      view3d.error = text;
      $('scene').classList.add('hidden');
      return false;
    }

    // ---- background handling --------------------------------------------

    // iOS suspends timers in a backgrounded tab anyway; this keeps the first poll
    // after returning prompt and avoids a burst of queued requests.
    function onVisibilityChange() {
      if (document.hidden) {
        clearTimeout(state.pollTimer);
        state.pollTimer = null;
      } else if (state.me) {
        startPolling();
      }
    }

    // ---- page load ------------------------------------------------------

    $('btn-locate').addEventListener('click', locate);
    $('btn-recentre').addEventListener('click', resetCamera);
    document.addEventListener('visibilitychange', onVisibilityChange);
    setInterval(render, TICK_MS);

    const has3d = initScene();
    setStatus(!PROXY_BASE
        ? 'No proxy configured — set PROXY_BASE in index.html (see proxy/README.md)'
        : has3d ? 'Tap "Find me" to start' : view3d.error,
      !PROXY_BASE || !has3d);
  </script>
</body>
</html>
