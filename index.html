<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MicroRadar</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --fg: #e6e8f0;
      --dim: #8b93ad;
      --line: #1e2743;
      --accent: #6ea8ff;
      --error: #ff8080;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      background: var(--bg);
      color: var(--fg);
      padding:
        env(safe-area-inset-top) env(safe-area-inset-right)
        env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow-x: hidden;
    }
    .wrap { padding: 12px; max-width: 46rem; margin: 0 auto; }
    header { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
    #status { margin-top: 4px; font-size: 16px; color: var(--dim); }
    #status.error { color: var(--error); }

    #controls { display: flex; gap: 8px; margin: 12px 0; }
    button {
      flex: 1 1 auto;
      min-height: 44px;
      padding: 10px 12px;
      font: inherit;
      font-size: 16px;
      color: var(--fg);
      background: #16203c;
      border: 1px solid var(--line);
      border-radius: 10px;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: #223055; }

    #me, #meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      color: var(--dim);
    }
    #meta { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line); }

    #aircraft { list-style: none; margin: 12px 0 0; padding: 0; }
    #aircraft li {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 15px;
      overflow-wrap: anywhere;
    }
    .row1 { display: flex; flex-wrap: wrap; gap: 4px 10px; }
    .call { font-weight: 600; color: var(--fg); }
    .type { color: var(--dim); }
    .row2 { margin-top: 2px; font-size: 13px; color: var(--dim); }
    .empty { color: var(--dim); font-size: 15px; padding: 8px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>MicroRadar</h1>
      <div id="status">Starting…</div>
    </header>

    <div id="controls">
      <button id="btn-locate" type="button">Find me</button>
      <button id="btn-source" type="button">adsb.lol</button>
    </div>

    <div id="me">No position yet.</div>

    <ol id="aircraft"></ol>

    <footer id="meta">No data yet.</footer>
  </div>

  <script>
    'use strict';

    // ---- constants (docs/plan-m1.md) ------------------------------------

    const POLL_MS = 8000;        // never below 5000; the aggregators allow 1 req/s
    const RADIUS_NM = 40;        // CLAUDE.md says 30-60 nm
    const FT_TO_M = 0.3048;
    const KT_TO_MPS = 0.514444;
    const FPM_TO_MPS = 0.00508;  // ft/min -> m/s (kept for milestone 2)
    const STALE_S = 60;          // drop aircraft whose position is older than this
    const TICK_MS = 500;         // re-render interval for extrapolation
    const EARTH_R = 6371000;     // metres

    const SOURCES = [
      { name: 'adsb.lol', url: (lat, lon, r) => `https://api.adsb.lol/v2/point/${lat}/${lon}/${r}` },
      { name: 'airplanes.live', url: (lat, lon, r) => `https://api.airplanes.live/v2/point/${lat}/${lon}/${r}` },
    ];

    // ---- state ----------------------------------------------------------

    const state = {
      me: null,          // { lat, lon, accuracy, at }
      sourceIndex: 0,
      aircraft: [],      // normalised aircraft from the last successful poll
      lastPollAt: 0,
      lastError: null,
      pollTimer: null,
    };

    const $ = (id) => document.getElementById(id);

    // ---- status ---------------------------------------------------------

    function setStatus(text, isError = false) {
      const el = $('status');
      el.textContent = text;
      el.classList.toggle('error', !!isError);
    }

    // ---- geolocation ----------------------------------------------------

    function locate() {
      if (!navigator.geolocation) {
        setStatus('Geolocation not available', true);
        return;
      }
      setStatus('Finding you…');
      navigator.geolocation.getCurrentPosition(onFix, onGeoError, {
        enableHighAccuracy: false,
        timeout: 15000,
        maximumAge: 60000,
      });
    }

    function onFix(pos) {
      state.me = {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        at: Date.now(),
      };
      $('btn-locate').textContent = 'Refresh position';
      setStatus('Got a fix');
      renderMe();
    }

    function onGeoError(err) {
      const msgs = {
        1: 'Location permission denied',
        2: 'Position unavailable',
        3: 'Location timed out',
      };
      setStatus(msgs[err.code] || ('Location error: ' + err.message), true);
    }

    function renderMe() {
      if (!state.me) {
        $('me').textContent = 'No position yet.';
        return;
      }
      const { lat, lon, accuracy, at } = state.me;
      const ageS = Math.round((Date.now() - at) / 1000);
      $('me').textContent =
        `${lat.toFixed(4)}, ${lon.toFixed(4)} · ±${Math.round(accuracy)} m · fix ${ageS}s ago`;
    }

    // ---- page load ------------------------------------------------------

    $('btn-locate').addEventListener('click', locate);
    $('btn-source').textContent = SOURCES[state.sourceIndex].name;
    setStatus('Tap "Find me" to start');
  </script>
</body>
</html>
